[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-runtime-os"
version = "0.1.169"
description = "面向多智能体的操作系统级执行时（Agent Runtime），支持 Dashboard Demo 创建 run 时自动注册 demo agents 以避免 runtime `/tasks` 404、Dashboard Cancel 级联取消 LangGraph 与 agentd runtime task、删除 state_store task 记录和 runtime run/task 目录、补齐 /tasks/{task_id}/cancel API、Docker agentd 启动/退出清理 agentd SQLite state.db 与 runtime workspaces/artifacts 防止旧 task 恢复调度、Docker agentd 清理 root-owned demo run 失败时自动用容器 fallback 删除、Dashboard Agent Topology 实时动态 UI、活动 Agent 脉冲、运行依赖边流动动画、状态计数和更新时间展示、Workflow 超时/异常基于最新 graph_state 写回失败终态避免覆盖 Tester/Repair/Reviewer 过程、Dashboard Demo LangGraph 流程面板和 reviewer 拒绝后的 Repair 进行中状态、DeepSeek Key 缺失时启动前/调用前明确失败、Dashboard Cancel 后端 404 时仍清空页面状态、Dashboard Demo 独立 Agent Topology 面板和旧 run 404 自动清空、Docker agentd 启动脚本自动清理 demo live run 避免恢复旧 run、Dashboard Demo 动态 Agent 拓扑图用圆点和箭头展示依赖与实时状态、Dashboard Demo 终态优先使用 graph_state 避免 Reviewer 历史失败覆盖最终成功、README 记录性能数据、数据来源与可靠性依据、Tester Runtime 超时/失败转换为测试失败摘要并进入 Repair 路由、Run summary 对 Runtime metrics snapshot 失败容错并优先落盘最终 graph_state、Dashboard Runtime Scheduling Layer 区分 Runtime agentd task/attempt 与 Direct 进程内执行、Dashboard Demo 当前 Agent/动作高亮与有向 LangGraph 节点关系图、Runtime provider 线程化 submit/wait_task 避免阻塞事件循环、Dashboard Cancel 删除当前 run 目录并清理页面状态、Dashboard 自动清理中断旧 run 的 URL/localStorage 并允许取消落盘旧 run、Dashboard 终态 run 停止轮询、Dashboard 标记 agentd 重启造成的孤儿 Pending run 为 INTERRUPTED、Runtime 任务等待取消固定 30 秒 HTTP 读超时并落盘真实失败原因、Dashboard 静态资源版本号避免旧 JS 缓存、Dashboard Demo 用 URL run_id 刷新恢复并挂载本地 Dashboard 静态目录、Dashboard Demo 刷新后恢复当前 run、Docker agentd 默认使用已有镜像并通过 REBUILD_DOCKER_IMAGE=1 重建、Dashboard 初始渲染容错、Docker agentd 跳过重复构建启动、README Docker agentd 启动说明修正、README demo 指令说明、README 亮点/框架/测试/启动重排、Coder 无 patch 立即失败路由、Runtime wait_task 轮询 HTTP 超时重试、Runtime Fault 证据按失败 coder_a 到 coder_b fallback pair 计算身份变化、Runtime Fault 注入优先命中当前 attempt 的 backend_pid、Runtime Fault 应用层等待 fallback attempt 完成、Runtime Fault coder 失败后零重试 fallback、Runtime Fault workflow 线程化避免注入协程阻塞、Runtime Fault 按 running coder_a backend_pid 注入、Runtime Fault 注入等待 LangGraph workflow 完成、Runtime Fault run task 发现与 backend started attempt pid 记录、Runtime backend event trace 归一化、Runtime direct_tool 错误前缀 JSON 解析、Runtime completed Agent 复用状态同步、Runtime tester direct_tool run_pytest payload、AgentCapability、异构 Backend 选择验证、Codex 结构化结果校验、Runtime attempt artifacts patch 提取、Runtime artifact 容器路径映射、Runtime agentd 可见 run-data 路径映射、Planner 空 JSON 输出重试、Planner Inspection 字符串搜索项兼容、Planner 同步 LLM 调用线程化避免 heartbeat 阻塞、Planner 真实 E2E task timeout 传递、DeepSeek v4 模型配置传递、agentd/E2E 共享 run-data 挂载、Runtime workspace payload 传递、Runtime Codex attempt workspace/Goal prompt 固定、Coder/Repair JSON-only 输出约束、openEuler Codex/bubblewrap privileged 沙箱、Codex attempt 级 CODEX_HOME 隔离、Direct Codex Pydantic 结构化校验、Codex CLI 非交互 exec 参数顺序、Codex artifact CODEX_HOME 预创建、Planner/Coder 失败态可观测记录、Reviewer JSON-only 输出约束与失败路由、TODO6 Direct 真实 E2E 成功证据、TODO7 Direct 连续成功验证、TODO8 真实 agentd 启动验证、2026-07-26 剩余 TODO 封板证据、剩余封板 TODO 清单记录、Runtime 真实后端校验、Runtime 取消链路任务追踪、Direct 真实 E2E worktree/artifact 证据持久化、真实 E2E workflow 超时取消、真实 E2E 节点级进度落盘、Docker PID1 子进程回收、真实 E2E PID1 防误跑、Codex 上游流断开重试、真实 E2E 并发可配置、真实 E2E 任务超时可配置、真实 E2E 挂载仓库 safe.directory 处理、preflight 非交互 Codex 探针、openEuler agentd Codex config 挂载、Direct 真实入口 Codex config 早失败、最终封板证据深度核验、证据密钥扫描排除 Codex 私有运行目录、Patch artifact 过滤 Codex 私有文件、Direct 输出隔离到 artifact 目录、运行证据忽略规则、镜像上下文排除运行证据、LangGraph 双执行模式、Planner 动态 DAG、Coder 拓扑串行执行、E2E 干净工作区准备、Runtime Fault 真实 E2E 入口、Benchmark 自动注册 Runtime Agent、Benchmark 故障恢复与 Recovery Context 场景参数、Benchmark 交错配对与公平性校验、正式 Benchmark 干净工作区门禁、Dashboard/Replay 证据无需视频、统一 manifest 输出、Attempt 级 worktree/artifact、Run Dashboard、统一资源管理、可靠通信、受控工具执行、fallback、Demo pytest 门禁与 benchmark"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "psutil>=5.9.0",
    "langgraph>=1.0,<2.0",
    "langgraph-checkpoint-sqlite>=3.0,<4.0",
]

[project.scripts]
agentd = "aruntime.daemon.main:main"
agentctl = "aruntime.cli.main:app"

[tool.setuptools.packages.find]
include = ["aruntime*", "applications*"]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
